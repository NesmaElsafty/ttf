<section class="ttf-testimonials-section" aria-labelledby="ttf-social-proof-heading">
  <h2 class="ttf-social-proof-heading" id="ttf-social-proof-heading" data-ttf-fade-in-down data-i18n="social.heading">
    Testimonials &amp; Social Proof
  </h2>

  <div class="ttf-testimonials" id="ttf-component">
    <aside class="ttf-side">
      <div class="ttf-brand">
        <span class="ttf-dot"></span>
        <h2 data-i18n="testimonials.brand">Testimonials</h2>
      </div>
      <p class="ttf-note" data-i18n="testimonials.note">Pick a heading to view matching testimonials.</p>

      <button class="ttf-btn ttf-active" data-key="people" type="button">
        <div>
          <div data-i18n="testimonials.people">What People Say About TTF</div>
          <span class="ttf-sub" data-i18n="testimonials.peopleSub">General praise &amp; highlights</span>
        </div>
        <span class="ttf-tag" data-i18n="testimonials.new">NEW</span>
      </button>

      <button class="ttf-btn" data-key="voices" type="button">
        <div>
          <div data-i18n="testimonials.voices">Voices from Our Community</div>
          <span class="ttf-sub" data-i18n="testimonials.voicesSub">Uploadable voice notes</span>
        </div>
      </button>

      <button class="ttf-btn" data-key="real" type="button">
        <div>
          <div data-i18n="testimonials.real">Real Feedback, Real Impact</div>
          <span class="ttf-sub" data-i18n="testimonials.realSub">Videos / case studies</span>
        </div>
      </button>
    </aside>

    <main class="ttf-main" aria-live="polite">
      <div class="ttf-head">
        <div class="ttf-title">
          <h3 id="ttf-heading">What People Say About TTF</h3>
          <small id="ttf-count">(2)</small>
        </div>
        <div class="ttf-chips" id="ttf-chips"></div>
      </div>
      <div class="ttf-scroll">
        <div class="ttf-grid" id="ttf-grid"></div>
      </div>
    </main>
  </div>
</section>
