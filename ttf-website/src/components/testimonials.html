<section class="ttf-testimonials-section" aria-labelledby="ttf-social-proof-heading">
  <h2 class="ttf-section-title ttf-social-proof-heading" id="ttf-social-proof-heading">
    Testimonials &amp; Social Proof
  </h2>

  <div class="ttf-testimonials" dir="ltr" id="ttf-component">
    <aside class="ttf-side">
      <div class="ttf-brand">
        <span class="ttf-dot"></span>
        <h2>Testimonials</h2>
      </div>
      <p class="ttf-note">Pick a heading to view matching testimonials.</p>

      <button class="ttf-btn ttf-active" data-key="people" type="button">
        <div>
          <div>What People Say About TTF</div>
          <span class="ttf-sub">General praise &amp; highlights</span>
        </div>
        <span class="ttf-tag">NEW</span>
      </button>

      <button class="ttf-btn" data-key="voices" type="button">
        <div>
          <div>Voices from Our Community</div>
          <span class="ttf-sub">Uploadable voice notes</span>
        </div>
      </button>

      <button class="ttf-btn" data-key="real" type="button">
        <div>
          <div>Real Feedback, Real Impact</div>
          <span class="ttf-sub">Videos / case studies</span>
        </div>
      </button>
    </aside>

    <main class="ttf-main" aria-live="polite">
      <div class="ttf-head">
        <div class="ttf-title">
          <h3 id="ttf-heading">What People Say About TTF</h3>
          <small id="ttf-count">(2)</small>
        </div>
        <div class="ttf-chips" id="ttf-chips"></div>
      </div>
      <div class="ttf-scroll">
        <div class="ttf-grid" id="ttf-grid"></div>
      </div>
    </main>
  </div>
</section>
